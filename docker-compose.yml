version: "3.9"

# =============================================================================
# LMIS — Local Development Docker Compose
# =============================================================================

networks:
  lmis_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
  model_cache:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary relational store (PSO, patients, audit ledger)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lmis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lmis_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - lmis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmis} -d ${POSTGRES_DB:-lmis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Qdrant — Vector store (medical knowledge + per-patient embeddings)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lmis_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - lmis_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Task queue (Celery broker) + session cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lmis_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - lmis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (raw docs, OCR crops, audit exports)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: lmis_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lmis_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-lmis_minio_secret_key_change_in_prod}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO console
    networks:
      - lmis_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  # MinIO Initializer — creates required buckets on first run
  # ---------------------------------------------------------------------------
  minio_init:
    image: minio/mc:latest
    container_name: lmis_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-lmis_minio_access} ${MINIO_SECRET_KEY:-lmis_minio_secret_key_change_in_prod};
        mc mb --ignore-existing local/${MINIO_BUCKET_DOCUMENTS:-lmis-documents};
        mc mb --ignore-existing local/${MINIO_BUCKET_OCR:-lmis-ocr-crops};
        mc mb --ignore-existing local/lmis-evaluation;
        mc mb --ignore-existing local/lmis-exports;
        echo 'MinIO buckets initialized.';
      "
    networks:
      - lmis_network

  # ---------------------------------------------------------------------------
  # Backend — FastAPI application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: lmis_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lmis}:${POSTGRES_PASSWORD:-lmis_dev_password}@postgres:5432/${POSTGRES_DB:-lmis_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app
      - model_cache:/app/.cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lmis_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  # ---------------------------------------------------------------------------
  # Celery Worker — async agent pipeline execution
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: lmis_celery_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lmis}:${POSTGRES_PASSWORD:-lmis_dev_password}@postgres:5432/${POSTGRES_DB:-lmis_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app
      - model_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lmis_network
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 -Q lmis_pipeline,lmis_ocr,lmis_ner,lmis_reasoning

  # ---------------------------------------------------------------------------
  # Celery Beat — scheduled tasks (e.g., periodic trend re-computation)
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: lmis_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lmis}:${POSTGRES_PASSWORD:-lmis_dev_password}@postgres:5432/${POSTGRES_DB:-lmis_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - lmis_network
    command: celery -A app.worker.celery_app beat --loglevel=info

  # ---------------------------------------------------------------------------
  # Frontend — Next.js application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: lmis_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8000}
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - lmis_network
    command: npm run dev
